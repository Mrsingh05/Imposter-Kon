const STORE_KEY = "kaunnakli.v3";
const DEFAULTS = {
  players: ["Player 1", "Player 2", "Player 3"],
  imposters: 1,
  categories: ["food", "animals", "sports", "bollywood", "cricket", "festivals", "places"],
  timeOn: false,
  timeSec: 60,
  hintOn: true,
};
function loadSaved() { try { return JSON.parse(localStorage.getItem(STORE_KEY)) || {}; } catch { return {}; } }
const saved = loadSaved();

const S = {
  screen: "home",      // home | setup | categories | handover | reveal | talk | final
  settings: (() => { const x = { ...DEFAULTS, ...(saved.settings || {}) }; delete x.hintLevel; return x; })(),
  game: null,
  modal: null,         // "players" | "how" | null
  toast: "",
  timerLeft: 0,
};
function save() { localStorage.setItem(STORE_KEY, JSON.stringify({ settings: S.settings })); }

/* ============================================================
   HELPERS
   ============================================================ */
const $app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const shuffle = arr => { const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const maxImposters = n => Math.max(1, Math.min(3, Math.floor((n - 1) / 2)));
const initial = s => esc((String(s).trim()[0] || "?").toUpperCase());

const normWord = s => s.toLowerCase().replace(/[^a-z0-9]/g, "");

function selectedWords() {
  const seen = new Set(); const out = [];
  for (const c of CATEGORIES) {
    if (!S.settings.categories.includes(c.id)) continue;
    for (const e of c.words) {
      const k = normWord(e.w);
      if (seen.has(k)) continue;
      seen.add(k); out.push({ word: e.w, h: e.h, cat: c.name });
    }
  }
  return out;
}

/* The round hint is the single indirect hint stored on the entry. */
const roundHint = entry => entry.h;

let toastTimer = null;
function toast(msg) {
  S.toast = msg; render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = ""; render(); }, 1600);
}

/* ============================================================
   GAME FLOW
   Home → Start a game → Setup → Continue
        → for each player: pass-the-phone → reveal (hold) → hide & pass
        → Start the game → talk (random starter)
        → See who's the imposter → result → Play again / Home
   ============================================================ */
let timerHandle = null;
const R = 74, CIRC = 2 * Math.PI * R;

function startGame() {
  const pool = selectedWords();
  if (!pool.length) return toast("Pick at least one category");
  const players = S.settings.players.map(p => p.trim() || "Player");
  const n = players.length;
  const impCount = Math.min(S.settings.imposters, maxImposters(n));

  let entry = pick(pool);
  if (S.game && S.game.word && pool.length > 1) {
    let guard = 0;
    while (entry.word === S.game.word && guard++ < 50) entry = pick(pool);
  }
  S.game = {
    players, n,
    word: entry.word, cat: entry.cat,
    hint: S.settings.hintOn ? roundHint(entry) : null,
    imposters: shuffle([...Array(n).keys()]).slice(0, impCount),
    revealPos: 0, showing: false, seenOnce: false,
    starter: Math.floor(Math.random() * n),
  };
  clearInterval(timerHandle); timerHandle = null;
  S.screen = "handover";
  render();
}

const isImposter = i => S.game.imposters.includes(i);

function nextCard() {
  const g = S.game;
  if (g.revealPos >= g.n - 1) {
    S.screen = "talk";
    restartTimer();
  } else {
    g.revealPos++; g.showing = false; g.seenOnce = false;
    S.screen = "handover";
  }
  render();
}

function restartTimer() {
  clearInterval(timerHandle); timerHandle = null;
  if (!S.settings.timeOn) return;
  S.timerLeft = S.settings.timeSec;
  timerHandle = setInterval(() => {
    S.timerLeft = Math.max(0, S.timerLeft - 1);
    if (S.timerLeft === 0) { clearInterval(timerHandle); timerHandle = null; }
    const num = document.getElementById("timer-num");
    const arc = document.getElementById("timer-arc");
    if (num) num.textContent = S.timerLeft;
    if (arc) arc.setAttribute("stroke-dashoffset", String(CIRC * (1 - S.timerLeft / S.settings.timeSec)));
    const tu = document.getElementById("time-up");
    if (tu && S.timerLeft === 0) tu.style.display = "inline-block";
  }, 1000);
}

function goHome() {
  clearInterval(timerHandle); timerHandle = null;
  S.screen = "home"; render();
}

/* ============================================================
   RENDER
   ============================================================ */
function render() {
  let html; let dark = false;
  switch (S.screen) {
    case "setup": html = renderSetup(); break;
    case "categories": html = renderCategories(); break;
    case "handover": html = renderHandover(); dark = true; break;
    case "reveal": html = renderReveal(); dark = true; break;
    case "talk": html = renderTalk(); break;
    case "final": html = renderFinal(); break;
    default: html = renderHome(); dark = true;
  }
  document.body.classList.toggle("dark", dark);
  let modal = "";
  if (S.modal === "players") modal = renderPlayersModal();
  if (S.modal === "how") modal = renderHowModal();
  $app.innerHTML = html + modal + (S.toast ? `<div class="toast">${esc(S.toast)}</div>` : "");
}

/* ============================================================
   EVENTS
   ============================================================ */
$app.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const act = el.dataset.act;
  const st = S.settings;

  switch (act) {
    case "goSetup": S.screen = "setup"; render(); break;
    case "continue": startGame(); break;
    case "start": startGame(); break;
    case "openCategories": S.screen = "categories"; render(); break;
    case "openPlayers": S.modal = "players"; render(); break;
    case "openHow": S.modal = "how"; render(); break;
    case "closeModal":
      if (el.classList.contains("modal-bg") && e.target !== el) break;
      S.modal = null; save(); render(); break;
    case "addPlayer":
      if (st.players.length < 16) { st.players.push("Player " + (st.players.length + 1)); save(); render(); }
      break;
    case "removePlayer": {
      const i = +el.dataset.i;
      if (st.players.length > 3) { st.players.splice(i, 1); save(); render(); }
      break;
    }
    case "step": {
      const d = +el.dataset.d;
      if (el.dataset.k === "players") {
        if (d > 0 && st.players.length < 16) st.players.push("Player " + (st.players.length + 1));
        if (d < 0 && st.players.length > 3) st.players.pop();
        st.imposters = Math.min(st.imposters, maxImposters(st.players.length));
      } else {
        const mx = maxImposters(st.players.length);
        st.imposters = Math.max(1, Math.min(mx, Math.min(st.imposters, mx) + d));
      }
      save(); render(); break;
    }
    case "toggleTime": st.timeOn = !st.timeOn; save(); render(); break;
    case "setTime": st.timeSec = +el.dataset.v; save(); render(); break;
    case "toggleHint": st.hintOn = !st.hintOn; save(); render(); break;
    case "toggleCat": {
      const id = el.dataset.id;
      st.categories = st.categories.includes(id) ? st.categories.filter(x => x !== id) : [...st.categories, id];
      save(); render(); break;
    }
    case "allCats":
      st.categories = st.categories.length === CATEGORIES.length ? [] : CATEGORIES.map(c => c.id);
      save(); render(); break;

    /* game flow */
    case "showReveal": S.screen = "reveal"; render(); break;
    case "nextCard": nextCard(); break;
    case "reveal": clearInterval(timerHandle); timerHandle = null; S.screen = "final"; render(); break;
    case "goHome": goHome(); break;
  }
});

$app.addEventListener("input", e => {
  if (e.target.matches("[data-input='player']")) {
    S.settings.players[+e.target.dataset.i] = e.target.value;
    save();
  }
});

/* Hold-to-reveal: press shows the card, release anywhere hides it */
$app.addEventListener("pointerdown", e => {
  if (S.screen !== "reveal" || !e.target.closest("[data-hold]") || S.game.showing) return;
  S.game.showing = true; S.game.seenOnce = true; render();
});
const releaseReveal = () => {
  if (S.screen !== "reveal" || !S.game || !S.game.showing) return;
  S.game.showing = false; render();
};
document.addEventListener("pointerup", releaseReveal);
document.addEventListener("pointercancel", releaseReveal);
$app.addEventListener("contextmenu", e => e.preventDefault());

render();
})();
